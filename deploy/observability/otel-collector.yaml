receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
      grpc: { endpoint: 0.0.0.0:4317 }

processors:
  batch: {}
  # Traces carry no request bodies by construction, but scrub anything that looks like a credential just in case.
  attributes/scrub:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
  # Keep all errors and slow traces; sample the rest. Raise the percentage in staging, lower it at production scale.
  tail_sampling:
    decision_wait: 5s
    policies:
      - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
      - { name: slow, type: latency, latency: { threshold_ms: 400 } }
      - { name: baseline, type: probabilistic, probabilistic: { sampling_percentage: 10 } }

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, tail_sampling, batch]
      exporters: [otlp/jaeger]
